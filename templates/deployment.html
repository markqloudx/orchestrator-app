{% extends "base.html" %}

{% block content %}

<h1>Live Deployment</h1>
<p class="muted">Track your CI/CD pipeline</p>

<br>

<div class="card">
    <div style="padding:20px;text-align:center;">
        <div style="font-size:48px;margin-bottom:16px;">🚀</div>
        <h2>Pipeline Status</h2>
        <div style="display:flex;justify-content:center;gap:20px;margin:20px 0;flex-wrap:wrap;align-items:center;">
            <div><span class="badge badge-ok">GitHub</span></div>
            <span style="font-size:20px;">→</span>
            <div><span class="badge badge-pending">PR</span></div>
            <span style="font-size:20px;">→</span>
            <div><span class="badge badge-approved">Approval</span></div>
            <span style="font-size:20px;">→</span>
            <div><span class="badge badge-merged">Merge</span></div>
            <span style="font-size:20px;">→</span>
            <div><span class="badge badge-deployed">PROD</span></div>
            <span style="font-size:20px;">→</span>
            <div><span class="badge badge-ok">Databricks</span></div>
        </div>
    </div>
</div>

{% endblock %}
