{% extends "base.html" %}

{% block content %}
<h1>Audit Trail</h1>

<div class="card">
    <table>
        <thead><tr><th>Time</th><th>Event</th><th>Change</th><th>Project</th><th>Result</th></tr></thead>
        <tbody>
            {% for a in audit %}
            <tr>
                <td>{{ a.time[:16] if a.time else '-' }}</td>
                <td>{{ a.event }}</td>
                <td>{{ a.change_id or '-' }}</td>
                <td>{{ a.project_id or '-' }}</td>
                <td><span class="badge badge-{{ a.result.lower() }}">{{ a.result }}</span></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
