<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Management</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f6f6f6;padding:20px}
.container{max-width:1400px;margin:0 auto}
.header{background:#fff;padding:20px;border-radius:10px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:800}
.logo span{color:#d71920}
.nav{display:flex;gap:10px;flex-wrap:wrap}
.nav a{text-decoration:none;color:#666;padding:8px 16px;border-radius:6px}
.nav a:hover{background:#f0f0f0}
.nav a.active{background:#d71920;color:#fff}
.card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1);margin-bottom:20px}
.btn{padding:8px 20px;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.btn-red{background:#d71920;color:#fff}
.btn-red:hover{background:#b9141a}
.btn-green{background:#16834b;color:#fff}
.btn-green:hover{background:#0f6a3d}
.btn-sm{padding:4px 12px;font-size:12px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px;background:#fafafa;border-bottom:2px solid #ddd}
td{padding:10px;border-bottom:1px solid #eee}
.badge{display:inline-block;padding:4px 8px;border-radius:12px;font-size:11px;font-weight:bold}
.badge-ok{background:#d4edda;color:#155724}
.badge-pending{background:#fff3cd;color:#856404}
.badge-approved{background:#d4edda;color:#155724}
.badge-deployed{background:#cce5ff;color:#004085}
.badge-grey{background:#eee;color:#666}
.grid{display:grid;gap:15px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.metric-label{color:#888;font-size:11px;text-transform:uppercase}
.metric-number{font-size:28px;font-weight:800}
.metric-number.blue{color:#315da8}
.metric-number.orange{color:#e67e22}
.metric-number.green{color:#16834b}
.metric-number.red{color:#d71920}
.muted{color:#777;font-size:12px}
.red-line{height:3px;background:#d71920;margin:10px 0 20px}
.notice{background:#fff5f5;border-left:4px solid #d71920;padding:13px;border-radius:5px}
.flow{display:flex;align-items:center;gap:10px;overflow-x:auto;padding:10px 0}
.flow-node{min-width:100px;padding:10px;text-align:center;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:11px}
.flow-node strong{display:block}
.flow-node.primary{border:2px solid #d71920}
.flow-arrow{color:#aaa;font-size:18px}
@media(max-width:768px){.grid-4{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">CHANGE <span>CONTROL</span></div>
        <div class="nav">
            <a href="/">Dashboard</a>
            <a href="/cost-centers">Cost Centers</a>
            <a href="/projects">Projects</a>
            <a href="/changes">Changes</a>
            <a href="/approvals">Approvals</a>
            <a href="/deployment">Deployment</a>
            <a href="/audit">Audit</a>
            <a href="/swagger">API</a>
        </div>
    </div>
    <div id="content">
        {% block content %}{% endblock %}
    </div>
</div>
</body>
</html>
