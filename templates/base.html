<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Management Control Center</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f6f6;color:#171717;}

header{height:64px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20;}
.logo{font-size:18px;font-weight:800;}
.logo span{color:#d71920;}
.header-right{font-size:12px;color:#666;}

.layout{display:flex;min-height:calc(100vh - 64px);}
aside{width:235px;background:#fff;border-right:1px solid #ddd;padding:15px;}
.nav-title{color:#999;font-size:10px;text-transform:uppercase;font-weight:bold;margin:15px 8px 7px;}
nav button{width:100%;background:#fff;border:0;padding:11px;text-align:left;border-radius:7px;cursor:pointer;margin-bottom:3px;color:#555;font-size:13px;}
nav button:hover,nav button.active{background:#fff0f1;color:#d71920;font-weight:bold;}

main{flex:1;padding:25px;max-width:1650px;}
h1{margin:0 0 5px;font-size:26px;}
h2{margin:0 0 10px;font-size:18px;}
.muted{color:#777;font-size:12px;}
.red-line{height:3px;background:#d71920;margin:12px 0 18px;}

.grid{display:grid;gap:15px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}

.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;}
.metric-label{color:#888;font-size:10px;text-transform:uppercase;font-weight:bold;}
.metric-number{font-size:29px;font-weight:800;margin-top:5px;}
.metric-number.red{color:#d71920;}
.metric-number.green{color:#16834b;}
.metric-number.blue{color:#315da8;}
.metric-number.orange{color:#e67e22;}

.btn{border:1px solid #ccc;background:#fff;padding:9px 13px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;}
.btn:hover{background:#f5f5f5;}
.btn-red{background:#d71920;border-color:#d71920;color:#fff;}
.btn-red:hover{background:#b9141a;color:#fff;}
.btn-green{background:#16834b;border-color:#16834b;color:#fff;}
.btn-green:hover{background:#0f6a3d;}
.btn-small{padding:6px 9px;font-size:11px;}

table{width:100%;border-collapse:collapse;}
th{background:#fafafa;color:#666;font-size:11px;text-align:left;padding:11px;border-bottom:1px solid #ddd;}
td{font-size:12px;padding:11px;border-bottom:1px solid #eee;vertical-align:middle;}

.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:bold;}
.badge-ok{background:#e6f6ec;color:#167342;}
.badge-pending{background:#fff3d5;color:#875d00;}
.badge-fail{background:#fdebed;color:#b3131a;}
.badge-grey{background:#eee;color:#666;}
.badge-approved{background:#d4edda;color:#155724;}
.badge-deployed{background:#cce5ff;color:#004085;}
.badge-merged{background:#cce5ff;color:#004085;}
.badge-rejected{background:#fdebed;color:#b3131a;}
.badge-conflict{background:#fdebed;color:#b3131a;}

.flow{display:flex;align-items:center;gap:7px;overflow-x:auto;padding:18px 3px;}
.flow-node{min-width:125px;padding:14px 9px;text-align:center;border:1px solid #ccc;border-radius:8px;background:#fff;font-size:11px;}
.flow-node strong{display:block;margin-bottom:5px;}
.flow-node.primary{border:2px solid #d71920;}
.flow-arrow{color:#aaa;font-weight:bold;}

.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:11px;font-weight:bold;color:#555;margin-bottom:5px;}
input,select,textarea{width:100%;border:1px solid #ccc;border-radius:7px;padding:9px;background:#fff;font-size:13px;}
textarea{min-height:80px;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;width:min(720px,94vw);max-height:90vh;overflow:auto;border-radius:12px;padding:23px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px;}

.toast{position:fixed;right:20px;bottom:20px;background:#fff;border-left:4px solid #d71920;padding:13px 18px;box-shadow:0 5px 25px rgba(0,0,0,.2);display:none;z-index:200;font-size:12px;}
.toast.show{display:block;}
.toast.success{border-left-color:#16834b;}
.toast.error{border-left-color:#d71920;}
.toast.conflict{border-left-color:#e67e22;}

@media(max-width:950px){.grid-4{grid-template-columns:repeat(2,1fr);}aside{width:190px;}}
@media(max-width:650px){.layout{display:block;}aside{width:100%;border-right:0;border-bottom:1px solid #ddd;}.grid-4,.grid-2{grid-template-columns:1fr;}main{padding:15px;}}
</style>
</head>

<body>

<header>
    <div class="logo">CHANGE <span>CONTROL</span> · DATABRICKS</div>
    <div class="header-right" id="clock"></div>
</header>

<div class="layout">

<aside>
    <div class="nav-title">Governance</div>
    <nav>
        <button onclick="location.href='/'">Executive Flow</button>
        <button onclick="location.href='/projects'">Projects</button>
        <button onclick="location.href='/changes'">Change Register</button>
        <button onclick="location.href='/approvals'">Approvals</button>
        <button onclick="location.href='/deployment'">Live Deployment</button>
    </nav>
</aside>

<main>
    {% block content %}{% endblock %}
</main>

</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <h2 id="modalTitle"></h2>
        <div id="modalBody"></div>
        <div class="modal-actions">
            <button class="btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
function updateClock() {
    document.getElementById('clock').innerText = new Date().toLocaleString();
}
setInterval(updateClock, 1000);
updateClock();

function showToast(message, type) {
    const toast = document.getElementById('toast');
    toast.innerText = message;
    toast.className = 'toast show ' + (type || '');
    setTimeout(() => toast.className = 'toast', 5000);
}

function openModal(title, body) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
});

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});
</script>

</body>
</html>
