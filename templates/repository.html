{% extends "base.html" %}

{% block content %}
<h1>Repository Control</h1>

<div class="card">
    <h2>GitHub Integration</h2>
    <table>
        <tr><td>DEV Repository</td><td><strong>{{ github_dev or 'Not Configured' }}</strong></td></tr>
        <tr><td>PROD Repository</td><td><strong>{{ github_prod or 'Not Configured' }}</strong></td></tr>
        <tr><td>Status</td><td><span class="badge badge-ok">● Connected</span></td></tr>
    </table>
</div>

<div class="card">
    <h2>Supported Providers</h2>
    <div class="flow">
        <div class="flow-node primary"><strong>GitHub</strong>Source</div>
        <div class="flow-arrow">→</div>
        <div class="flow-node"><strong>CI/CD</strong>Pipeline</div>
        <div class="flow-arrow">→</div>
        <div class="flow-node primary"><strong>Databricks</strong>Deploy</div>
    </div>
</div>
{% endblock %}
