{% extends "base.html" %}

{% block content %}
<h1>Projects</h1>
<button class="btn btn-red" onclick="openModal()">+ Register Project</button>
<br><br>

<div class="card">
    <table>
        <thead><tr><th>ID</th><th>Name</th><th>Cost Center</th><th>Repository</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
            {% for p in projects %}
            <tr id="row-{{ p.project_id }}">
                <td><strong>{{ p.project_id }}</strong></td>
                <td>{{ p.name }}</td>
                <td>{{ p.cost_center_id }}</td>
                <td>{{ p.repository_name or p.repository_url or '-' }}</td>
                <td><span class="badge badge-{{ p.aws_status.lower() }}">{{ p.aws_status }}</span></td>
                <td>
                    <button class="btn btn-sm btn-green" onclick="verify('{{ p.project_id }}')">Verify</button>
                    <button class="btn btn-sm" onclick="detect('{{ p.project_id }}')">Detect</button>
                    <button class="btn btn-sm btn-red" onclick="del('{{ p.project_id }}')">Delete</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
function openModal() {
    const html = `
        <div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:center;justify-content:center;">
            <div style="background:#fff;padding:30px;border-radius:10px;max-width:500px;width:90%;">
                <h2>Register Project</h2>
                <div style="margin:10px 0"><label>Project ID</label><br><input id="pid" value="PRJ-${Math.floor(Math.random()*900+100)}" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:5px"></div>
                <div style="margin:10px 0"><label>Name</label><br><input id="pname" placeholder="Project name" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:5px"></div>
                <div style="margin:10px 0"><label>Cost Center</label><br>
                    <select id="pcc" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:5px">
                        {% for c in cost_centers %}<option value="{{ c.cc_id }}">{{ c.cc_id }} - {{ c.name }}</option>{% endfor %}
                    </select>
                </div>
                <div style="margin:10px 0"><label>Repository URL</label><br><input id="prepo" placeholder="https://github.com/user/repo" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:5px"></div>
                <div style="margin:10px 0"><label>Repository Name</label><br><input id="preponame" placeholder="repo-name" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:5px"></div>
                <div style="margin:10px 0"><label>Branch</label><br><input id="pbranch" value="main" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:5px"></div>
                <button onclick="createProject()" class="btn btn-red" style="width:100%;padding:10px;">Create</button>
                <button onclick="document.querySelectorAll('div[style*="position:fixed"]').forEach(e=>e.remove())" style="margin-top:10px;width:100%;padding:10px;border:none;background:#eee;border-radius:5px;cursor:pointer">Cancel</button>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
}

function createProject() {
    const data = {
        project_id: document.getElementById('pid').value,
        name: document.getElementById('pname').value,
        cost_center_id: document.getElementById('pcc').value,
        repository_url: document.getElementById('prepo').value,
        repository_name: document.getElementById('preponame').value,
        branch: document.getElementById('pbranch').value
    };
    fetch('/api/projects', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
    }).then(r=>r.json()).then(d=>{
        if(d.success){alert('✅ Project created!');location.reload();}
        else alert('❌ '+d.error);
    });
}

function verify(pid) {
    fetch('/api/projects/'+pid+'/verify')
        .then(r=>r.json())
        .then(d=>{
            if(d.success){alert('✅ Connected: '+d.connected+'\nBranches: '+(d.branches||[]).join(', '));location.reload();}
            else alert('❌ '+d.error);
        });
}

function detect(pid) {
    const branch = prompt('Branch:', 'main');
    if(!branch) return;
    fetch('/api/detect-changes', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({project_id: pid, branch: branch})
    }).then(r=>r.json()).then(d=>{
        if(d.success){alert('✅ '+d.count+' changes detected');}
        else alert('❌ '+d.error);
    });
}

function del(pid) {
    if(!confirm('Delete project '+pid+'?')) return;
    fetch('/api/projects/'+pid, {method:'DELETE'})
        .then(r=>r.json())
        .then(d=>{if(d.success){alert('✅ Deleted');location.reload();}else alert('❌ '+d.error);});
}
</script>
{% endblock %}
